services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      env_file: .env.production
    restart: unless-stopped
    env_file: .env.production
    environment:
      - NODE_ENV=production
    ports:
      - "80:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
