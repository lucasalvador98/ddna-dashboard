name: Publish image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: image-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 and publish revision tag and digest
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          docker buildx build --platform linux/amd64 --push \
            -f Dockerfile --build-arg SOURCE_REVISION="$REVISION" --build-arg NEXT_PUBLIC_BASE_PATH=/observatorio --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --tag ghcr.io/lucasalvador98/ddna-dashboard:"$REVISION" --metadata-file image.json .
      - name: Keep digest/build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ github.event.workflow_run.head_sha }}
          path: image.json
          retention-days: 90
