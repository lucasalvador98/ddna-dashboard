name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/host -p 'test_*.py'
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (strict, no baseline suppression)
        if: matrix.check == 'lint'
        run: npm run lint
      - name: Unit tests (no production credentials)
        if: matrix.check == 'tests'
        run: npm run test:run -- --maxWorkers=2
      - name: Build, types and /observatorio image
        if: matrix.check == 'build'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
          NEXT_PUBLIC_BASE_PATH: /observatorio
        run: |
          npm run build
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --build-arg NEXT_PUBLIC_BASE_PATH -t ddna-ci:dashboard .
      - name: Standalone /observatorio smoke (disposable, dummy backend)
        if: matrix.check == 'build'
        run: python3 deploy/smoke-local.py
  validate:
    name: Validate dashboard
    if: always()
    needs: [controller, application]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          ALL_OK: ${{ needs.controller.result == 'success' && needs.application.result == 'success' }}
        run: test "$ALL_OK" = true
